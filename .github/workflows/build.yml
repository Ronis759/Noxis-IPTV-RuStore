name: Build APK (RuStore)

# Сборка APK для RuStore в GitHub Actions.
# APK появляется во вкладке Actions → выбранный запуск → Artifacts.
# При желании (workflow_dispatch + release) он же публикуется в Releases.

permissions:
  contents: write

on:
  push:
    branches: [main]
    # правки только документации сборку не запускают
    paths-ignore: ["**.md", "LICENSE", ".github/dependabot.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз с APK"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # новый push отменяет ещё не закончившуюся сборку того же коммита
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Ключ нужен, чтобы APK можно было загрузить в RuStore: отладочная подпись магазином не принимается
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4   # gradle-wrapper.jar должен совпадать с официальным

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи из Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 не задан: APK будет подписан отладочным ключом, RuStore такой файл не примет"
            exit 0
          fi
          # выбрасываем всё, что не входит в base64: переносы строк, пробелы, кавычки, случайные символы
          RAW=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          echo "Секрет KEYSTORE_BASE64: ${#RAW} символов base64"
          if ! printf '%s' "$RAW" | base64 -d > "$RUNNER_TEMP/release.keystore" 2> "$RUNNER_TEMP/b64.err"; then
            echo "::error::KEYSTORE_BASE64 не декодируется ($(cat "$RUNNER_TEMP/b64.err")), символов: ${#RAW}. Скорее всего значение скопировано не целиком."
            exit 1
          fi
          SIZE=$(stat -c%s "$RUNNER_TEMP/release.keystore")
          echo "Ключ подписи: $SIZE байт"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Файл ключа слишком мал ($SIZE байт): секрет KEYSTORE_BASE64 скопирован не целиком"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::Ключ не открывается паролем KEYSTORE_PASSWORD — проверьте KEYSTORE_PASSWORD в Secrets"
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Юнит-тесты
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Проверка APK перед загрузкой в RuStore
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 | sort -V | tail -1)

          echo "--- пакет и версия ---"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label:" | head -3

          # Главное условие модерации: разрешений на установку APK и на запись в память быть не должно
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.txt"
          for p in REQUEST_INSTALL_PACKAGES WRITE_EXTERNAL_STORAGE; do
            if grep -q "$p" "$RUNNER_TEMP/manifest.txt"; then
              echo "::error::В APK есть $p — RuStore запросит пояснение или отклонит сборку"
              exit 1
            fi
          done
          echo "REQUEST_INSTALL_PACKAGES и WRITE_EXTERNAL_STORAGE отсутствуют — ок"

          # Каким ключом подписан APK: RuStore принимает только постоянный ключ, не отладочный
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          DN=$("$APKSIGNER" verify --print-certs "$APK" | grep "certificate DN" | head -1)
          echo "$DN"
          if echo "$DN" | grep -q "Android Debug"; then
            echo "::warning::APK подписан отладочным ключом — для RuStore нужны секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
          fi

      - name: Переименовать APK и посчитать SHA-256
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME="noxis-iptv-rustore-$VER.apk"
          cd app/build/outputs/apk/release
          mv app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noxis-iptv-rustore-apk
          path: |
            app/build/outputs/apk/release/${{ steps.apk.outputs.name }}
            app/build/outputs/apk/release/${{ steps.apk.outputs.name }}.sha256
          if-no-files-found: error

      - name: Публикация релиза
        if: github.event_name == 'workflow_dispatch' && inputs.release && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # тег с номером сборки: одинаковые версии в build.gradle.kts не перезаписывают друг друга
          tag_name: rustore-${{ steps.apk.outputs.version }}-${{ github.run_number }}
          name: RuStore ${{ steps.apk.outputs.version }} (${{ steps.apk.outputs.code }}) — сборка ${{ github.run_number }}
          body: |
            APK для RuStore: `${{ steps.apk.outputs.name }}`
            Версия: ${{ steps.apk.outputs.version }}, номер сборки: ${{ steps.apk.outputs.code }}
            Разрешение REQUEST_INSTALL_PACKAGES: отсутствует.
            Контрольная сумма — в файле `.sha256`.
          files: |
            app/build/outputs/apk/release/${{ steps.apk.outputs.name }}
            app/build/outputs/apk/release/${{ steps.apk.outputs.name }}.sha256
          make_latest: true
